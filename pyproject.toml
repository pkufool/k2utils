[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "k2utils"
version = "0.1.0"
description = "Install pre-built wheels for the k2 ecosystem"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
dependencies = ["packaging>=22"]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov"]

[project.scripts]
k2utils = "k2utils.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
